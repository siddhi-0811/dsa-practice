name: Move GFG files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  move-gfg-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move root Markdown files to geeksforgeek
        run: |
          mkdir -p geeksforgeek

          for file in *.md; do
            if [ -f "$file" ] && [ "$file" != "README.md" ]; then
              mv "$file" geeksforgeek/
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          
          if git diff --cached --quiet; then
            echo "No files to move."
          else
            git commit -m "Move GFG solutions to geeksforgeek"
            git push
          fi
